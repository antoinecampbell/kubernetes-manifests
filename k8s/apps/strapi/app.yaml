---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: strapi-data
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: microk8s-hostpath
  volumeName: strapi-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: strapi-data
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  storageClassName: microk8s-hostpath
  hostPath:
    path: /home/antoine/home-server/strapi/data/
    type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: strapi-config
  labels:
    app: strapi
data:
  DATABASE_CLIENT: "postgres"
  DATABASE_HOST: "main-postgresql.postgres.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "strapi"
  DATABASE_USERNAME: "strapi"
  DATABASE_SSL: "false"
  NODE_ENV: "development"
  PUBLIC_URL: "https://strapi.home-server.antoine-campbell.com"
  ADMIN_URL: "https://strapi.home-server.antoine-campbell.com/admin"
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: strapi-secrets
  namespace: strapi
spec:
  encryptedData:
    DATABASE_PASSWORD: 
  template:
    metadata:
      name: strapi-secrets
      namespace: strapi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strapi
  labels:
    app: strapi
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: strapi
  template:
    metadata:
      labels:
        app: strapi
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: strapi
          image: vshadbolt/strapi:5.50.2-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: strapi-config
            - secretRef:
                name: strapi-secrets
          ports:
            - name: http
              containerPort: 1337
          volumeMounts:
            - name: strapi-data
              mountPath: /srv/app
      volumes:
        - name: strapi-data
          persistentVolumeClaim:
            claimName: strapi-data
---
apiVersion: v1
kind: Service
metadata:
  name: strapi
  labels:
    app: strapi
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 1337
  selector:
    app: strapi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  name: strapi
spec:
  rules:
    - host: strapi.home-server.antoine-campbell.com
      http:
        paths:
          - backend:
              service:
                name: strapi
                port:
                  name: http
            path: /
            pathType: ImplementationSpecific
  tls:
    - secretName: home-server-wildcard-signed-prod
